name: Build WKB Remote APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore original project archive
        run: |
          base64 -d WkbRemote-Full.zip.b64 > WkbRemote-Full.zip
          unzip -q WkbRemote-Full.zip
      - name: Build debug APK
        working-directory: WkbRemote-Full/android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WkbRemote-apk
          path: WkbRemote-Full/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
