name: Build WKB Remote APK (fixed button spacing)
on:
  push:
    paths:
      - '.github/workflows/build-fixed-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Reduce spacing between buttons
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/wkbremote/MainActivity.kt')
          s = p.read_text()
          old = 'setMargins(dp(4), dp(4), dp(4), dp(4))'
          new = 'setMargins(dp(2), dp(2), dp(2), dp(2))'
          if old not in s:
              raise SystemExit('Expected button margin expression was not found; refusing to build an unpatched APK.')
          p.write_text(s.replace(old, new))
          print('Button margins changed from 4dp to 2dp on each side.')
          PY
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WkbRemote-apk-fixed
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
